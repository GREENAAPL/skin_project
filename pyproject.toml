[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin_project"
version = "0.1.0"
description = "Image-only ISIC 2018 skin-lesion classification and brightness robustness"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pandas",
    "numpy",
    "scikit-learn",
    "Pillow",
    "matplotlib",
    "PyYAML",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["outputs", "runs", "data", ".git", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"
